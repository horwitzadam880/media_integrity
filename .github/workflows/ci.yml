name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
    steps:
      # Pull your source code into the GitHub runner workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Buildx (Advanced Docker engine feature that enables caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to the GitHub Container Registry using built-in credentials
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub automatically creates a special, temporary credential called secrets.GITHUB_TOKEN every single time a workflow starts up

      # Build the image from your Dockerfile and push it to GHCR
      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}
            ghcr.io/horwitzadam880/media_integrity:latest
          # This automatically grabs the commit timestamp and passes it as a build arg
          build-args: |
            SOURCE_DATE_EPOCH=${{ fromJSON(github.event.inputs.source_date_epoch || 'null') || github.event.repository.pushed_at || 0 }}

          # These cache lines drastically reduce your workflow build times on subsequent runs
          cache-from: type=gha # Before I waste time building anything, let me check GitHub's cache to see if these exact Dockerfile layers were already built in a previous run. If they match, I'll instantly download them instead of compiling them again
          cache-to: type=gha,mode=max # Once the build finishes, export and upload every single layer—including the deep, intermediate build stages (mode=max)—back to GitHub's storage so the next pipeline run can use them.

      # New Step: Generate Build Provenance for the Container Image using its exact hash
      - name: Attest Built Docker Container Image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/horwitzadam880/media_integrity
          subject-digest: ${{ steps.build-image.outputs.digest }}
  run-scraper:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
      id-token: write # Required for Sigstore attestation
      attestations: write # Required for saving Sigstore provenance data
      packages: read # Required to pull your private container image
    env:
      CONTAINER_DIGEST: ${{ needs.build-and-push-image.outputs.image_digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull explicit image
        run: docker pull ghcr.io/horwitzadam880/media_integrity@${{ needs.build-and-push-image.outputs.image_digest }}

      # 👇 FIXED NETWORKING: Programmatically instantiates your isolated forensic bridge network
      - name: Create Forensic Bridge Network
        run: docker network create --driver bridge secure_forensics_net

      - name: Create output dir
        run: |
          mkdir -p output
          touch output/manifest.json

      # 👇 FOREGROUND EXECUTION: This blocks the terminal naturally until the scraper finishes.
      # No file copies or CID files are required; the volume mirror handles the file handover.
      - name: Run Forensic Scraper Container
        env:
          GDRIVE_CONTAINER_ENV: ${{ secrets.GDRIVE_KEY }}
          DROPBOX_CONTAINER_ENV: ${{ secrets.DROPBOX_KEY }}
        run: |
          docker run --name scraper-container \
             -t \
            --init \
            -w /forensic_scraper \
            --network secure_forensics_net \
            -e GDRIVE_KEY="$GDRIVE_CONTAINER_ENV" \
            -e DROPBOX_KEY="$DROPBOX_CONTAINER_ENV" \
            --cap-add=NET_ADMIN --cap-add=NET_RAW \
            ghcr.io/horwitzadam880/media_integrity@${{ needs.build-and-push-image.outputs.image_digest }}

      - name: Copy manifest from container to host
        run: |
          mkdir -p ${{ github.workspace }}/output
          docker cp scraper-container:/forensic_scraper/output/manifest.json ${{ github.workspace }}/output/manifest.json

      # 🔄 FIXED USE CASE: Pure cryptographic signing of the program's output data
      - name: Cryptographically Sign Evidence Manifest Data
        uses: sigstore/gh-action-sigstore-python@v3.5.0 # ◄ latest Official Sigstore file data signer
        with:
          inputs: output/manifest.json

      # Securely uploads the metadata file
      - name: Upload Court Evidence Metadata
        uses: actions/upload-artifact@v4
        with:
          name: forensic-scraper-run-${{ github.sha }}
          path: |
            output/manifest.json
            output/manifest.json.sigstore.json

      - name: Run verification tests
        run: npm run test:run
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Secure Node Dependencies
        run: npm ci
        env:
          CLOUDSMITH_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_AUTH_TOKEN }} # 👈 Injects token securely into memory on the fly

      - name: Run tests
        run: npm run test:run
