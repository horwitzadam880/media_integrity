name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    #ubuntu-latest -- previous

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Secure Node Dependencies
        run: npm ci
        env:
          CLOUDSMITH_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_AUTH_TOKEN }} # 👈 Injects token securely into memory on the fly

      - name: Run tests
        run: npm run test:run

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run ESLint and fix
        run: npm run lint:fix

      - name: Format with Prettier
        run: npm run format

      - name: Check for remaining ESLint errors
        run: npm run lint

      - name: Check for remaining formatting issues
        run: npm run format:check
  build-and-push-image:
    runs-on: ubuntu-latest
    #ubuntu-latest -- previous

    steps:
      # Step 1: Pull your source code into the GitHub runner workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Buildx (Advanced Docker engine feature that enables caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to the GitHub Container Registry using built-in credentials
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub automatically creates a special, temporary credential called secrets.GITHUB_TOKEN every single time a workflow starts up

      # Step 4: Downcase the image name to ensure compliance with Docker registry rules
      - name: Convert Image Name to Lowercase
        id: string
        run: |
          echo "IMAGE_ID=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Step 5: Build the image from your Dockerfile and push it to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}
            ghcr.io/horwitzadam880/media_integrity:latest
          # These cache lines drastically reduce your workflow build times on subsequent runs
          cache-from: type=gha # Before I waste time building anything, let me check GitHub's cache to see if these exact Dockerfile layers were already built in a previous run. If they match, I'll instantly download them instead of compiling them again
          cache-to: type=gha,mode=max # Once the build finishes, export and upload every single layer—including the deep, intermediate build stages (mode=max)—back to GitHub's storage so the next pipeline run can use them.

  run-scraper:
    runs-on: ubuntu-latest
    needs: build-and-push-image # Ensures this job waits until the new image is ready
    permissions:
      packages: read
      contents: read
      id-token: write # Required for Sigstore attestation
      attestations: write # Required for Sigstore attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Runtime Environment File
        env:
          GDRIVE_KEY: ${{ secrets.GDRIVE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "GDRIVE_KEY='${GDRIVE_KEY}'" > .env
          echo "IMAGE_TAG=${COMMIT_SHA}" >> .env

      - name: Prepare Output Directory
        run: mkdir -p output

      # - name: Run Scraper via Docker Compose
      #   run: |
      #     docker compose \
      #       -f docker-compose.yaml \
      #       -f docker-compose.prod.yaml \
      #       --env-file .env \
      #       up --no-build --abort-on-container-exit

      - name: Run Scraper via Docker Compose
        run: |
          # 1. Run the containers in detached background mode so the shell stays alive
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env up -d --no-build --cidfile scraper_container.cid

          # 2. Force the runner shell to wait interactively until the app container naturally finishes
          # (Replace "app" with whatever service name your scraper uses inside your docker-compose file)
          docker wait $(docker compose ps -q app)

          # 3. Clean up the container stack safely
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml down

      - name: Run Scraper and Capture ID via Engine JSON
        run: |
          mkdir -p output

          # 1. Spin up the background container stack
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml --env-file .env up -d --no-build

          # 2. PROGRAMMATIC CAPTURE: Extract the exact, unchangeable 64-character ID from the engine JSON
          TARGET_CONTAINER_ID=$(docker compose -f docker-compose.yaml -f docker-compose.prod.yaml ps app --format json | jq -r '.[0].ID // .ID')
          echo "Engine verified Container ID at birth: ${TARGET_CONTAINER_ID}"

          # 3. CRITICAL LEGAL GUARD: Crash if the variable resolved to blank
          if [ -z "${TARGET_CONTAINER_ID}" ] || [ "${TARGET_CONTAINER_ID}" = "null" ]; then
            echo "❌ CRITICAL FAILURE: Docker engine returned an empty ID. Container failed to initialize."
            exit 1
          fi

          # 4. Stream background logs for court transparency
          docker logs ${TARGET_CONTAINER_ID} &

          # 5. Wait for the captured container to finish running its scrapers
          echo "Pausing pipeline. Waiting for container execution to complete..."
          docker wait ${TARGET_CONTAINER_ID}

          # 6. GLOBAL ISOLATION AUDIT: Enforce that absolutely no other containers co-existed
          ALL_CONTAINERS=$(docker ps -a -q)
          GLOBAL_COUNT=$(echo "${ALL_CONTAINERS}" | grep -c . || true)

          echo "=== GLOBAL DOCKER INTEGRITY AUDIT ==="
          echo "Total containers detected on host VM: ${GLOBAL_COUNT}"

          if [ "${GLOBAL_COUNT}" -ne 1 ]; then
            echo "❌ INTEGRITY BREAK: Parallel container spoofing or execution tampering detected!"
            exit 1
          fi

          # 7. PROVENANCE BINDING: Prove this container belongs explicitly to this Git commit
          SPAWNED_FROM_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${TARGET_CONTAINER_ID})
          EXPECTED_IMAGE="ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}"

          echo "Verified container source origin: ${SPAWNED_FROM_IMAGE}"

          if [ "${SPAWNED_FROM_IMAGE}" != "${EXPECTED_IMAGE}" ]; then
            echo "❌ ORIGIN TAMPER ALERT: Container ancestry does not match this workflow run commit."
            exit 1
          fi

          echo "✅ DOUBLE-LOCK SUCCESSFUL: Absolute isolation and chain-of-custody verified."


          echo "=== Root hash manifest: ===\n"
          cat manifest.json

      # - name: Fix File Permissions for Attestation Engine
      #   run: sudo chown -R $USER:$USER output/

      - name: Generate Authenticated Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "output/manifest.json"
