name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    #ubuntu-latest -- previous

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Secure Node Dependencies
        run: npm ci
        env:
          CLOUDSMITH_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_AUTH_TOKEN }} # 👈 Injects token securely into memory on the fly

      - name: Run tests
        run: npm run test:run

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run ESLint and fix
        run: npm run lint:fix

      - name: Format with Prettier
        run: npm run format

      - name: Check for remaining ESLint errors
        run: npm run lint

      - name: Check for remaining formatting issues
        run: npm run format:check
  build-and-push-image:
    runs-on: ubuntu-latest
    #ubuntu-latest -- previous

    steps:
      # Step 1: Pull your source code into the GitHub runner workspace
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Buildx (Advanced Docker engine feature that enables caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to the GitHub Container Registry using built-in credentials
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub automatically creates a special, temporary credential called secrets.GITHUB_TOKEN every single time a workflow starts up

      # # Step 4: Downcase the image name to ensure compliance with Docker registry rules
      # - name: Convert Image Name to Lowercase
      #   id: string
      #   run: |
      #     echo "IMAGE_ID=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Step 5: Build the image from your Dockerfile and push it to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}
            ghcr.io/horwitzadam880/media_integrity:latest
          # These cache lines drastically reduce your workflow build times on subsequent runs
          cache-from: type=gha # Before I waste time building anything, let me check GitHub's cache to see if these exact Dockerfile layers were already built in a previous run. If they match, I'll instantly download them instead of compiling them again
          cache-to: type=gha,mode=max # Once the build finishes, export and upload every single layer—including the deep, intermediate build stages (mode=max)—back to GitHub's storage so the next pipeline run can use them.

  run-scraper:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: read
      id-token: write # Required for Sigstore attestation
      attestations: write # Required for saving Sigstore provenance data
      packages: read # Required to pull your private container image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull explicit image
        run: docker pull ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}

      # 👇 FIXED NETWORKING: Programmatically instantiates your isolated forensic bridge network
      - name: Create Forensic Bridge Network
        run: docker network create --driver bridge secure_forensics_net

      - name: Create output dir
        run: |
          mkdir -p output
          touch output/manifest.json

      # # Downcase the image name to ensure compliance with Docker registry rules
      # - name: Convert Image Name to Lowercase
      #   id: string
      #   run: |
      #     echo "IMAGE_ID=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $IMAGE_ID_LOWERCASE

      # 👇 FOREGROUND EXECUTION: This blocks the terminal naturally until the scraper finishes.
      # No file copies or CID files are required; the volume mirror handles the file handover.
      - name: Run Forensic Scraper Container
        env:
          GDRIVE_CONTAINER_ENV: ${{ secrets.GDRIVE_KEY }}
        run: |
          docker run --rm \
             -t \
            --init \
            -w /forensic_scraper \
            -v ${{ github.workspace }}/output/manifest.json:/forensic_scraper/output/manifest.json \
            --network secure_forensics_net \
            -e GDRIVE_KEY="$GDRIVE_CONTAINER_ENV" \
            --cap-add=NET_ADMIN --cap-add=NET_RAW \
            ghcr.io/horwitzadam880/media_integrity:${{ github.sha }}

      # Fixes file permissions since the container wrote files as root
      - name: Reclaim File Ownership
        run: sudo chown -R $USER:$USER output/

      # Generates Authenticated Build Provenance using Sigstore infrastructure
      - name: Generate Authenticated Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "output/manifest.json"

      # Securely uploads the metadata file under your 500MB free cap
      - name: Upload Court Evidence Metadata
        uses: actions/upload-artifact@v4
        with:
          name: forensic-scraper-run-${{ github.sha }}
          path: output/manifest.json
